<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%233B5998'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%23FFFFFF' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%234AA878'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>tpl-workspace</title>
    <script>
      // 首屏防闪烁（specs/005-theme）：在 body 渲染前解析 localStorage `theme` 三态并设置 data-theme。
      // 与 src/stores/theme.ts 共享持久化键与解析规则：system → 读系统深浅色。
      ;(function () {
        var theme = 'system'
        try {
          var stored = localStorage.getItem('theme')
          if (stored === 'light' || stored === 'dark' || stored === 'system') {
            theme = stored
          }
        } catch {
          theme = 'system'
        }
        var dark =
          theme === 'dark' ||
          (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
